name: CI

on:
  push:
    branches: [master, "v2*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build the .exe
        run: python packaging/build.py
      - name: Self-test the .exe
        shell: pwsh
        run: |
          $env:SRTAI_HOME = "$PWD\selftest-home"
          $p = Start-Process dist\SRTAI_Translator.exe -ArgumentList "selftest","--out","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          $size = "{0:N1} MB" -f ((Get-Item dist\SRTAI_Translator.exe).Length / 1MB)
          Write-Output "::notice title=SRTAI_Translator.exe::Self-test passed, size $size"
      - name: Open the app and take a screenshot
        shell: pwsh
        run: |
          $env:SRTAI_HOME = "$PWD\smoke-home"
          New-Item -ItemType Directory -Force $env:SRTAI_HOME | Out-Null
          '{"appearance": "dark", "geometry": "1180x800+20+20"}' | Set-Content "$env:SRTAI_HOME\settings.json"
          $app = Start-Process dist\SRTAI_Translator.exe -ArgumentList "tests\data\sample.en.srt" -PassThru
          Start-Sleep -Seconds 20
          python -c "from PIL import ImageGrab; ImageGrab.grab().save('screenshot.png')"
          if ($app.HasExited) { Write-Error "The app closed by itself (exit code $($app.ExitCode))"; exit 1 }
          Stop-Process -Id $app.Id
          Get-Content "$env:SRTAI_HOME\srtai.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: SRTAI_Translator-windows
          path: dist/SRTAI_Translator.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            screenshot.png
            selftest.txt
