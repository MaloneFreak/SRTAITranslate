name: Screenshots

# Run manually (Actions tab -> Screenshots -> Run workflow) to refresh the README images in docs/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Take screenshots
        run: python packaging/screenshot.py docs
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.png
          git diff --cached --quiet || git commit -m "Update screenshots"
          git push
