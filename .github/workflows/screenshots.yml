name: Screenshots

# Refreshes the README images in docs/. Run it from the Actions tab (Screenshots -> Run workflow);
# it also runs on release branches when the screenshot script changes.
on:
  workflow_dispatch:
  push:
    branches: ["v2*"]
    paths: ["packaging/screenshot.py", ".github/workflows/screenshots.yml"]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Take screenshots
        run: python packaging/screenshot.py docs
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.png
          git diff --cached --quiet || git commit -m "Update screenshots"
          git push
