name: Screenshots

# Refreshes the README images in docs/. Run it from the Actions tab (Screenshots -> Run workflow);
# it also runs on release branches when the screenshot script changes.
on:
  workflow_dispatch:
  push:
    branches: ["v2*"]
    paths: ["packaging/screenshot.py", ".github/workflows/screenshots.yml"]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Take screenshots
        shell: bash
        run: |
          set -o pipefail
          python packaging/screenshot.py docs 2>&1 | tee shot.log
          ls -la docs
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.png
          git diff --cached --quiet || git commit -m "Update screenshots"
          git push 2>&1 | tee push.log
      - name: Report problems
        if: failure()
        shell: bash
        run: |
          for f in shot.log push.log; do
            [ -f "$f" ] && tail -n 15 "$f" | while IFS= read -r line; do echo "::warning title=$f::$line"; done
          done
          ls docs 2>&1 | while IFS= read -r line; do echo "::warning title=docs::$line"; done
