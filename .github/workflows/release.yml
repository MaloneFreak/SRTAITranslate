name: Release

# Builds the Windows .exe for a version and attaches it to the GitHub release.
#
# - Release created on GitHub (Releases -> Draft a new release -> new tag such as v2.0.0 -> Publish):
#   your title and notes are kept; a few minutes later this adds SRTAI_Translator.exe and its .sha256.
# - Only a tag pushed (git tag v2.0.0 && git push origin v2.0.0): this creates the release, with
#   docs/release-notes/<version>.md (or the CHANGELOG section) as notes.
on:
  release:
    types: [published]
  push:
    tags: ["v*", "[0-9]*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Decide what to do
        id: mode
        shell: bash
        run: |
          # Publishing on GitHub fires both events; the "release" run does the work.
          if [ "${{ github.event_name }}" = "push" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists; the release-event run attaches the files."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.mode.outputs.skip != 'true'
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        if: steps.mode.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.mode.outputs.skip != 'true'
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        if: steps.mode.outputs.skip != 'true'
        run: python -m pytest -q
      - name: Build the .exe
        if: steps.mode.outputs.skip != 'true'
        run: python packaging/build.py
      - name: Self-test the .exe
        if: steps.mode.outputs.skip != 'true'
        shell: pwsh
        run: |
          $env:SRTAI_HOME = "$PWD\selftest-home"
          $p = Start-Process dist\SRTAI_Translator.exe -ArgumentList "selftest","--out","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          $hash = (Get-FileHash dist\SRTAI_Translator.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SRTAI_Translator.exe" | Set-Content dist\SRTAI_Translator.exe.sha256
      - name: Attach to the release
        if: steps.mode.outputs.skip != 'true'
        shell: bash
        run: |
          files="dist/SRTAI_Translator.exe dist/SRTAI_Translator.exe.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            python packaging/release_notes.py "$TAG" release_notes.md
            gh release create "$TAG" $files --verify-tag --title "SRT AI Translator ${TAG#v}" \
              --notes-file release_notes.md || gh release upload "$TAG" $files --clobber
          fi
          echo "::notice title=Release $TAG::Attached SRTAI_Translator.exe and SRTAI_Translator.exe.sha256"
